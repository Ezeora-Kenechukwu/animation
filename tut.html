    ********ATTRIBUTES*********
    These are key=value pairs written inside the opening tag of an element that:
    1. gives the element an Identity (unique identity or group identity like id and class)
    2. Affect the behaviour of an element(like type, disabled, hidden etc)
    3. and/or affect the asthetic nature and structure of an element(style attribute)
    examples:
    src(source): this is used to reference the path to the image or video or any other files we want to load in our html
